def configureBenchmarkServerPropertiesIn = { File runDir, String seedValue, String serverPortValue = null ->
    runDir.mkdirs()
    def propsFile = new File(runDir, "server.properties")
    def lines = propsFile.exists() ? propsFile.readLines("ISO-8859-1") : []

    def upsertProp = { String key, String value ->
        if (value == null || value.isBlank()) {
            return
        }
        def updated = false
        for (int i = 0; i < lines.size(); i++) {
            if (lines[i].startsWith("${key}=")) {
                lines[i] = "${key}=${value}"
                updated = true
                break
            }
        }
        if (!updated) {
            lines.add("${key}=${value}")
        }
    }

    upsertProp("level-seed", seedValue)
    if (serverPortValue != null && !serverPortValue.isBlank()) {
        upsertProp("server-port", serverPortValue)
        upsertProp("query.port", serverPortValue)
    }

    propsFile.setText(lines.join(System.lineSeparator()) + System.lineSeparator(), "ISO-8859-1")
}

def configureBenchmarkServerProperties = { String seedValue ->
    configureBenchmarkServerPropertiesIn(file("neoforge/run"), seedValue)
}

