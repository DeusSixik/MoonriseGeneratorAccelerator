subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'


    def dfcNativeMissingMarker = rootProject.layout.buildDirectory.file("dfcNative/status/no-natives.marker").get().asFile
    def dfcArchiveFileName = { AbstractArchiveTask archiveTask ->
        def classifier = archiveTask.archiveClassifier.orNull
        def classifierSuffix = classifier ? "-${classifier}" : ""
        def nativeSuffix = dfcNativeMissingMarker.isFile() && classifier != "sources" ? "-nn" : ""
        return "[${project.version}] ${rootProject.archives_name}-${project.name}${classifierSuffix}${nativeSuffix}.${archiveTask.archiveExtension.get()}"
    }

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    loom {
        accessWidenerPath = file("../common/src/main/resources/btsengineconcurrent.accesswidener")
    }

    tasks.withType(AbstractArchiveTask).configureEach { archiveTask ->
        archiveFileName.set(provider { dfcArchiveFileName(archiveTask) })
        doFirst {
            archiveFileName.set(dfcArchiveFileName(archiveTask))
        }
    }

    repositories {
        flatDir {
            dirs rootProject.file('libs')
        }
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()

        testImplementation platform('org.junit:junit-bom:5.10.0')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.mockito:mockito-core:5.11.0'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}

tasks.register("runBenchmarks") {
    group = "benchmark"
    description = "Runs Vanilla and Moonrise benchmarks 2 times each sequentially."

    doLast {
        def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
        def gradleCmd = isWindows ? file("gradlew.bat").absolutePath : "./gradlew"

        // Р‘РµСЂРµРј РїСѓС‚СЊ Рє Java, РЅР° РєРѕС‚РѕСЂРѕР№ СЃРµР№С‡Р°СЃ СЂР°Р±РѕС‚Р°РµС‚ СЌС‚РѕС‚ СЃРєСЂРёРїС‚ (РЅР°РїСЂРёРјРµСЂ, РёР· РЅР°СЃС‚СЂРѕРµРє IDE)
        def currentJavaHome = System.getProperty("java.home")

        def runTest = { String name, String extraArgs, int count ->
            println "======================================="
            println "  START TESTING: $name"
            println "======================================="

            for (int i = 1; i <= count; i++) {
                println "\n---> [$name] РџСЂРѕРіРѕРЅ $i РёР· $count <---"

                exec {
                    // РџСЂРёРЅСѓРґРёС‚РµР»СЊРЅРѕ РїРµСЂРµРґР°РµРј РїСЂР°РІРёР»СЊРЅС‹Р№ JAVA_HOME РІ РєРѕРЅСЃРѕР»СЊ
                    environment "JAVA_HOME", currentJavaHome

                    // --no-daemon РЅСѓР¶РµРЅ С‡С‚РѕР±С‹ РїСЂРѕС†РµСЃСЃС‹ РЅРµ СЃР»РёРїР°Р»РёСЃСЊ Рё РїР°РјСЏС‚СЊ РѕС‡РёС‰Р°Р»Р°СЃСЊ
                    def fullCommand = "$gradleCmd :neoforge:runServer $extraArgs --no-daemon"

                    if (isWindows) {
                        commandLine 'cmd', '/c', fullCommand
                    } else {
                        commandLine 'bash', '-c', fullCommand
                    }
                }

                // Р–РґРµРј 2 СЃРµРєСѓРЅРґС‹ РїРѕСЃР»Рµ С‚РѕРіРѕ РєР°Рє СЃРµСЂРІРµСЂ РџРћР›РќРћРЎРўР¬Р® СѓРјРµСЂ
                sleep(2000)
            }
        }

//        runTest("Vanilla", "", 2)
        runTest("Moonrise", "-PwithMoonrise", 4)

        println "\nBenchmarks end!"
    }
}

tasks.register("runFeatureVmBenchmarks") {
    group = "benchmark"
    description = "Runs raw vanilla-ish vs FeatureVM-only server benchmarks."

    doLast {
        def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
        def gradleCmd = isWindows ? file("gradlew.bat").absolutePath : "./gradlew"
        def currentJavaHome = System.getProperty("java.home")
        def runs = (findProperty("benchRuns") ?: "3") as int
        def benchWorldSeed = (findProperty("benchWorldSeed") ?: "918273645546372819").toString()

        def runTest = { String name, String jvmArgs ->
            println "======================================="
            println "  START FEATURE VM TEST: $name"
            println "  JVM ARGS: $jvmArgs"
            println "  WORLD SEED: $benchWorldSeed"
            println "======================================="

            for (int i = 1; i <= runs; i++) {
                println "\n---> [$name] run $i of $runs <---"
                configureBenchmarkServerProperties(benchWorldSeed)
                exec {
                    environment "JAVA_HOME", currentJavaHome
                    commandLine gradleCmd, ":neoforge:runServer", "-PgaJvmArgs=$jvmArgs", "--no-daemon"
                }
                sleep(2000)
            }
        }

        runTest("Vanilla-ish GA disabled", "-Dga.benchmark.disableAllPatches=true")
        runTest("FeatureVM only", "-Dga.benchmark.featuresOnly=true -Dga.benchmark.featureVmOnly=true -Dga.benchmark.featureVm=true")
        runTest("FeatureVM only with metrics", "-Dga.benchmark.featuresOnly=true -Dga.benchmark.featureVmOnly=true -Dga.benchmark.featureVm=true -Dga.featureVm.metrics=true")

        println "\nFeatureVM benchmarks end!"
    }
}

