tasks.register("runDecorationPipelineQuickBenchmarks") {
    group = "benchmark"
    description = "Runs a short no-Spark baseline vs Java decoration pipeline comparison."

    doLast {
        def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
        def gradleCmd = isWindows ? file("gradlew.bat").absolutePath : "./gradlew"
        def currentJavaHome = System.getProperty("java.home")
        def runs = (findProperty("benchRuns") ?: "1") as int
        def quickStartTick = findProperty("quickStartTick") ?: "20"
        def quickStopTick = findProperty("quickStopTick") ?: "260"
        def quickHaltTick = findProperty("quickHaltTick") ?: "320"
        def quickTicksBetweenBatches = findProperty("quickTicksBetweenBatches") ?: "10"
        def quickRenderDistance = findProperty("quickRenderDistance") ?: "8"
        def quickResetWorld = findProperty("quickResetWorld") ?: "true"
        def quickStartupWatchdogSeconds = findProperty("quickStartupWatchdogSeconds") ?: "90"
        def quickTickWatchdogSeconds = findProperty("quickTickWatchdogSeconds") ?: "30"
        def quickMaxBatches = findProperty("quickMaxBatches")
        def quickWorldSeed = (findProperty("quickWorldSeed") ?: "918273645546372819").toString()
        def quickMode = (findProperty("quickMode") ?: "both").toString()
        def quickPipelineMetrics = (findProperty("quickPipelineMetrics") ?: "false").toString().toBoolean()
        def quickPipelineFlatBlocks = (findProperty("quickPipelineFlatBlocks") ?: "true").toString().toBoolean()
        def quickArgs = "-Dga.benchmark.useSpark=false " +
                "-Dga.benchmark.startTick=$quickStartTick " +
                "-Dga.benchmark.stopTick=$quickStopTick " +
                "-Dga.benchmark.haltTick=$quickHaltTick " +
                "-Dga.benchmark.ticksBetweenBatches=$quickTicksBetweenBatches " +
                "-Dga.benchmark.renderDistance=$quickRenderDistance " +
                "-Dga.benchmark.resetWorld=$quickResetWorld " +
                "-Dga.benchmark.startupWatchdogSeconds=$quickStartupWatchdogSeconds " +
                "-Dga.benchmark.tickWatchdogSeconds=$quickTickWatchdogSeconds"
        if (quickMaxBatches != null) {
            quickArgs += " -Dga.benchmark.maxBatches=$quickMaxBatches"
        }

        def runTest = { String name, String jvmArgs ->
            println "======================================="
            println "  START QUICK DECORATION TEST: $name"
            println "  JVM ARGS: $jvmArgs"
            println "  WORLD SEED: $quickWorldSeed"
            println "======================================="

            for (int i = 1; i <= runs; i++) {
                println "\n---> [$name] run $i of $runs <---"
                def sparkConfigDir = file("neoforge/run/config/spark")
                sparkConfigDir.mkdirs()
                file("neoforge/run/config/spark/config.json").text = '{"backgroundProfiler":false}\n'
                configureBenchmarkServerProperties(quickWorldSeed)
                exec {
                    environment "JAVA_HOME", currentJavaHome
                    commandLine gradleCmd, ":neoforge:runServer", "-PgaJvmArgs=$jvmArgs", "--no-daemon"
                }
                sleep(1000)
            }
        }

        if (quickMode == "both" || quickMode == "baseline") {
            runTest("Quick baseline GA disabled", "-Dga.benchmark.disableAllPatches=true $quickArgs")
        }
        if (quickMode == "both" || quickMode == "pipeline") {
            def metricsArg = quickPipelineMetrics ? "-Dga.decorationPipeline.metrics=true " : ""
            def flatBlocksArg = quickPipelineFlatBlocks ? "-Dga.config.enableFlatBlockStructurePatch=true " : ""
            runTest("Quick decoration pipeline", "-Dga.benchmark.featuresOnly=true ${metricsArg}${flatBlocksArg}$quickArgs")
        }

        println "\nQuick decoration pipeline benchmarks end!"
    }
}

tasks.register("runGAChunkgenBenchmark") {
    group = "benchmark"
    description = "Runs a short GA-only real in-game chunk generation benchmark without Mockito."

    doLast {
        def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
        def gradleCmd = isWindows ? file("gradlew.bat").absolutePath : "./gradlew"
        def currentJavaHome = System.getProperty("java.home")
        def runs = (findProperty("benchRuns") ?: "1") as int
        def benchStartTick = findProperty("chunkgenStartTick") ?: "20"
        def benchStopTick = findProperty("chunkgenStopTick") ?: "260"
        def benchHaltTick = findProperty("chunkgenHaltTick") ?: "320"
        def benchTicksBetweenBatches = findProperty("chunkgenTicksBetweenBatches") ?: "10"
        def benchRenderDistance = findProperty("chunkgenRenderDistance") ?: "8"
        def benchMaxBatches = findProperty("chunkgenMaxBatches")
        def benchResetWorld = findProperty("chunkgenResetWorld") ?: "true"
        def benchWorldSeed = (findProperty("chunkgenWorldSeed") ?: "918273645546372819").toString()
        def benchRunDirPath = findProperty("chunkgenRunDir") ?: "run-ga-chunkgen"
        def benchRunDir = file("neoforge/${benchRunDirPath}")
        def benchServerPort = findProperty("chunkgenServerPort")
        def startupWatchdogSeconds = findProperty("chunkgenStartupWatchdogSeconds") ?: "120"
        def tickWatchdogSeconds = findProperty("chunkgenTickWatchdogSeconds") ?: "45"
        def chunkgenDfcTelemetry = findProperty("chunkgenDfcTelemetry") ?: "false"
        def chunkgenDfcTelemetrySampleShift = findProperty("chunkgenDfcTelemetrySampleShift") ?: "7"
        def chunkgenDfcRuntimeChecks = findProperty("chunkgenDfcRuntimeChecks") ?: "false"
        def chunkgenDfcBatchedFill = findProperty("chunkgenDfcBatchedFill") ?: "true"
        def chunkgenDfcVectorApi = findProperty("chunkgenDfcVectorApi") ?: "off"
        def chunkgenDfcCompileQueue = findProperty("chunkgenDfcCompileQueue") ?: "jdk"
        def chunkgenDfcCellFillAddExternOverride = findProperty("chunkgenDfcCellFillAddExternOverride") ?: "true"
        def chunkgenDfcInlineWrapAxis = findProperty("chunkgenDfcInlineWrapAxis") ?: "true"
        def chunkgenExtraJvmArgs = findProperty("chunkgenExtraJvmArgs") ?: ""
        def chunkgenArgs = "-Dga.benchmark.useSpark=false " +
                "-Dga.benchmark.directChunkLoad=true " +
                "-Dga.benchmark.diagnostics=true " +
                "-Ddfc.telemetry.enabled=$chunkgenDfcTelemetry " +
                "-Ddfc.telemetry.sampleShift=$chunkgenDfcTelemetrySampleShift " +
                "-Ddfc.parity.runtimeChecks=$chunkgenDfcRuntimeChecks " +
                "-Ddfc.codegen.batchedFill=$chunkgenDfcBatchedFill " +
                "-Ddfc.codegen.vectorApi=$chunkgenDfcVectorApi " +
                "-Ddfc.codegen.cellFillAddExternOverride=$chunkgenDfcCellFillAddExternOverride " +
                "-Ddfc.codegen.inlineWrapAxis=$chunkgenDfcInlineWrapAxis " +
                "-Ddfc.compileQueue=$chunkgenDfcCompileQueue " +
                "-Ddfc.cellfill.stats=$chunkgenDfcTelemetry " +
                "-Dga.dfc.cacheFastPath.stats=$chunkgenDfcTelemetry " +
                "-Dga.benchmark.startTick=$benchStartTick " +
                "-Dga.benchmark.stopTick=$benchStopTick " +
                "-Dga.benchmark.haltTick=$benchHaltTick " +
                "-Dga.benchmark.ticksBetweenBatches=$benchTicksBetweenBatches " +
                "-Dga.benchmark.renderDistance=$benchRenderDistance " +
                "-Dga.benchmark.resetWorld=$benchResetWorld " +
                "-Dga.benchmark.startupWatchdogSeconds=$startupWatchdogSeconds " +
                "-Dga.benchmark.tickWatchdogSeconds=$tickWatchdogSeconds" +
                (chunkgenExtraJvmArgs.toString().isBlank() ? "" : " ${chunkgenExtraJvmArgs}")
        if (benchMaxBatches != null) {
            chunkgenArgs += " -Dga.benchmark.maxBatches=$benchMaxBatches"
        }

        for (int i = 1; i <= runs; i++) {
            println "======================================="
            println "  START GA CHUNKGEN BENCHMARK: run $i of $runs"
            println "  JVM ARGS: $chunkgenArgs"
            println "  WORLD SEED: $benchWorldSeed"
            println "  RUN DIR: $benchRunDir"
            println "======================================="
            def sparkConfigDir = new File(benchRunDir, "config/spark")
            sparkConfigDir.mkdirs()
            new File(sparkConfigDir, "config.json").text = '{"backgroundProfiler":false}\n'
            configureBenchmarkServerPropertiesIn(benchRunDir, benchWorldSeed, benchServerPort == null ? null : benchServerPort.toString())
            exec {
                environment "JAVA_HOME", currentJavaHome
                commandLine gradleCmd, ":neoforge:runServer", "-PgaJvmArgs=$chunkgenArgs", "-PgaRunDir=${benchRunDirPath}", "-PwithoutSpark", "--no-daemon"
            }
            sleep(1000)
        }

        println "\nGA chunkgen benchmark end!"
    }
}
