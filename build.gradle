plugins {
    id 'dev.architectury.loom' version '1.13-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

    repositories {
        mavenCentral()
        maven { url = "https://maven.bawnorton.com/releases" }
        maven { url = "https://maven.enjarai.dev/mirrors" }

        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven { url = "https://maven.createmod.net" } // Ponder, Flywheel
        maven { url = "https://maven.ithundxr.dev/snapshots" }
        maven { url = "https://maven.blamejared.com" }
        maven { url = "https://harleyoconnor.com/maven" }
        maven { url = "https://maven.theillusivec4.top/" }
        maven { url = "https://maven.squiddev.cc" }
        maven { url = "https://www.cursemaven.com" }
        maven { url = "https://api.modrinth.com/maven" }
        maven { url = "https://maven.ftb.dev/releases" }
        maven { url = "https://maven.architectury.dev" }
        maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" }
        maven { url = "https://jitpack.io" }

        maven {
            url "https://maven.su5ed.dev/releases"
        }

        maven {
            url = "https://jm.gserv.me/repository/maven-public"
            content {
                includeGroup "info.journeymap"
                includeGroup "mysticdrew"
            }
        }

        maven {
            name "latviandevReleases"
            url "https://maven.latvian.dev/releases"
        }
        maven {
            name "kTT MavenReleases"
            url "https://maven.kessokuteatime.work/releases"
        }

        maven {
            name 'luck-repo'
            url 'https://repo.lucko.me/'
            content {
                includeModule 'me.lucko', 'spark-api'
            }
        }
    }
}



subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    loom {
        accessWidenerPath = file("../common/src/main/resources/btsengineconcurrent.accesswidener")
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        archiveFileName.set(provider {
            def classifier = archiveClassifier.get()
            def classifierSuffix = classifier ? "-${classifier}" : ""

            // project.version             => Версия мода
            // rootProject.archives_name   => Имя мода
            // project.name                => Лоадер (fabric, neoforge, common)
            return "[${project.version}] ${rootProject.archives_name}-${project.name}${classifierSuffix}.${archiveExtension.get()}"
        })
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()

        testImplementation platform('org.junit:junit-bom:5.10.0')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.mockito:mockito-core:5.11.0'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}

tasks.register("runBenchmarks") {
    group = "benchmark"
    description = "Runs Vanilla and Moonrise benchmarks 2 times each sequentially."

    doLast {
        def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
        def gradleCmd = isWindows ? "gradlew.bat" : "./gradlew"

        // Берем путь к Java, на которой сейчас работает этот скрипт (например, из настроек IDE)
        def currentJavaHome = System.getProperty("java.home")

        def runTest = { String name, String extraArgs, int count ->
            println "======================================="
            println "  START TESTING: $name"
            println "======================================="

            for (int i = 1; i <= count; i++) {
                println "\n---> [$name] Прогон $i из $count <---"

                exec {
                    // Принудительно передаем правильный JAVA_HOME в консоль
                    environment "JAVA_HOME", currentJavaHome

                    // --no-daemon нужен чтобы процессы не слипались и память очищалась
                    def fullCommand = "$gradleCmd :neoforge:runServer $extraArgs --no-daemon"

                    if (isWindows) {
                        commandLine 'cmd', '/c', fullCommand
                    } else {
                        commandLine 'bash', '-c', fullCommand
                    }
                }

                // Ждем 2 секунды после того как сервер ПОЛНОСТЬЮ умер
                sleep(2000)
            }
        }

//        runTest("Vanilla", "", 2)
        runTest("Moonrise", "-PwithMoonrise", 4)

        println "\nBenchmarks end!"
    }
}

tasks.register("runFeatureVmBenchmarks") {
    group = "benchmark"
    description = "Runs raw vanilla-ish vs FeatureVM-only server benchmarks."

    doLast {
        def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
        def gradleCmd = isWindows ? "gradlew.bat" : "./gradlew"
        def currentJavaHome = System.getProperty("java.home")
        def runs = (findProperty("benchRuns") ?: "3") as int

        def runTest = { String name, String jvmArgs ->
            println "======================================="
            println "  START FEATURE VM TEST: $name"
            println "  JVM ARGS: $jvmArgs"
            println "======================================="

            for (int i = 1; i <= runs; i++) {
                println "\n---> [$name] run $i of $runs <---"
                exec {
                    environment "JAVA_HOME", currentJavaHome
                    commandLine gradleCmd, ":neoforge:runServer", "-PgaJvmArgs=$jvmArgs", "--no-daemon"
                }
                sleep(2000)
            }
        }

        runTest("Vanilla-ish GA disabled", "-Dga.benchmark.disableAllPatches=true")
        runTest("FeatureVM only", "-Dga.benchmark.featuresOnly=true -Dga.benchmark.featureVmOnly=true -Dga.benchmark.featureVm=true")
        runTest("FeatureVM only with metrics", "-Dga.benchmark.featuresOnly=true -Dga.benchmark.featureVmOnly=true -Dga.benchmark.featureVm=true -Dga.featureVm.metrics=true")

        println "\nFeatureVM benchmarks end!"
    }
}
