plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def lwjglNatives = osName.contains('win')
        ? 'natives-windows'
        : (osName.contains('mac') ? 'natives-macos' : 'natives-linux')
def javaToGpuRuntimeLibraries = [
        "io.github.deussixik:javatogpu:${rootProject.java_to_gpu_version}",
        "io.github.deussixik:javatogpu-ir-optimizer:${rootProject.java_to_gpu_version}",
        "io.github.deussixik:packager:1.0.0-alpha.1",
        "com.github.javaparser:javaparser-core:3.28.1",
        "org.lwjgl:lwjgl-opencl:3.3.3",
        "org.lwjgl:lwjgl:3.3.3:${lwjglNatives}"
]

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.7-beta.1")))

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    include(minecraftRuntimeLibraries("com.github.ben-manes.caffeine:caffeine:3.1.8"))
    include(minecraftRuntimeLibraries("com.github.JCTools.JCTools:jctools-core:v4.0.3"))
    include(minecraftRuntimeLibraries("com.github.DeusSixik:JavaNativeCollections:$rootProject.java_native_collections_version"))

    include(minecraftRuntimeLibraries("org.yaml:snakeyaml:2.2"))
    include(minecraftRuntimeLibraries("ca.spottedleaf:yamlconfig:1.0.2"))

    javaToGpuRuntimeLibraries.each { coordinate ->
        include(minecraftRuntimeLibraries(coordinate))
    }
    annotationProcessor "io.github.deussixik:javatogpu:${rootProject.java_to_gpu_version}"
    annotationProcessor "io.github.deussixik:javatogpu-ir-validation:${rootProject.java_to_gpu_version}"

    modRuntimeOnly 'me.lucko:fabric-permissions-api:0.3.3'
//    modRuntimeOnly "curse.maven:spark-361579:5759670"

    if (project.hasProperty('withMoonrise')) {
        modRuntimeOnly "curse.maven:moonrise-1096335:7089176"
    }

    if (project.hasProperty('withC2ME')) {
        modImplementation "curse.maven:c2me-533097:7176425"
    }

}

processResources {
    inputs.property 'version', project.version
    def commonProject = project(':common')
    def commonMixinConfigListFile = commonProject.ext.gaGeneratedCommonMixinConfigListFile
    dependsOn commonProject.tasks.named('generateGAMixinMetadata')
    inputs.file commonMixinConfigListFile

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }

    doLast {
        def mixinConfigs = commonMixinConfigListFile.readLines('UTF-8').findAll { !it.isBlank() }
        def outputFile = file("${destinationDir}/fabric.mod.json")
        def parsed = new groovy.json.JsonSlurper().parse(outputFile) as Map
        parsed.mixins = mixinConfigs
        outputFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(parsed)) + System.lineSeparator(), 'UTF-8')
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

tasks.matching { it.name.startsWith("run") || it.name.startsWith("prepareRun") }.configureEach {
    dependsOn project(":common").tasks.named("processResources")
}

tasks.withType(JavaExec).configureEach {
    if (rootProject.hasProperty("gaJvmArgs")) {
        jvmArgs rootProject.property("gaJvmArgs").toString().split("\\s+").findAll { !it.isBlank() }
    }
}
