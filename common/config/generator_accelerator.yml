# Biome climate index tuning options.
# These values are applied to the old biome system properties on startup,
# so you no longer need to manage biome VM args manually.
biome-climate:
  # Enables adaptive disabling of useless query cache instances.
  # Mirrors old VM arg: -Dga.climate.adaptiveQueryCache=true
  adaptive-query-cache: true
  # Leaf-count threshold for switching to linear search.
  # 0 keeps the tree path always enabled.
  # Mirrors old VM arg: -Dga.climate.linearSearchThreshold=0
  linear-search-threshold: 0
  # Hit-rate shift used by adaptive cache heuristics.
  # Mirrors old VM arg: -Dga.climate.queryCacheDisableHitRateShift=7
  query-cache-disable-hit-rate-shift: 7
  # Probe count before adaptive cache disable is evaluated.
  # Mirrors old VM arg: -Dga.climate.queryCacheDisableProbes=2048
  query-cache-disable-probes: 2048
  # Query cache size for biome climate lookups.
  # Use 0 to disable. Non-power-of-two values are rounded down internally.
  # Mirrors old VM arg: -Dga.climate.queryCacheSize=64
  query-cache-size: 64
  # Enables second warm-start lookup for climate index searches.
  # Mirrors old VM arg: -Dga.climate.secondWarmStart=true
  second-warm-start: true
  # Enables nearest-first child sorting during climate index traversal.
  # Mirrors old VM arg: -Dga.climate.sortChildrenByDistance=true
  sort-children-by-distance: true
# Density Function Compiler debug and tuning options.
# These values are applied to the old DFC system properties on startup,
# so you no longer need to manage DFC VM args manually.
dfc:
  # Enables Beardifier runtime statistics collection.
  # Keep false for normal world loading; this is diagnostic-only.
  # Mirrors old VM arg: -Dga.beardifier.stats=true
  beardifier-stats: false
  # Enables direct-read cache fast-path statistics.
  # Mirrors old VM arg: -Dga.dfc.cacheFastPath.stats=true
  cache-fast-path-stats: false
  # Enables the narrow ADD(Beardifier, residual) cell-fill override experiment.
  # Unlike cellFillAddExternOverride, this does not specialize generic ADD(extern, residual) roots.
  # Mirrors old VM arg: -Ddfc.codegen.cellFillAddBeardifierOverride=true
  cell-fill-add-beardifier-override: false
  # Enables add-extern cell-fill override experiments.
  # Mirrors old VM arg: -Ddfc.codegen.cellFillAddExternOverride=true
  cell-fill-add-extern-override: false
  # Enables direct residual extern cell-fill specialization.
  # Mirrors old VM arg: -Ddfc.codegen.cellFillDirectExternResidual=true
  cell-fill-direct-extern-residual: false
  # Enables cell-fill parity checks.
  # Mirrors old VM arg: -Ddfc.cellfill.parity=true
  cell-fill-parity: false
  # Allowed epsilon for cell-fill parity checks.
  # Mirrors old VM arg: -Ddfc.cellfill.parity.epsilon=1.0E-9
  cell-fill-parity-epsilon: 1.0E-9
  # Maximum number of cell-fill parity checks.
  # Mirrors old VM arg: -Ddfc.cellfill.parity.maxChecks=1024
  cell-fill-parity-max-checks: 1024
  # Enables extra residual class debug for cell-fill stats.
  # Mirrors old VM arg: -Ddfc.cellfill.stats.residualClassDebug=true
  cell-fill-residual-class-debug: false
  # Enables cell-fill runtime statistics.
  # Mirrors old VM arg: -Ddfc.cellfill.stats=true
  cell-fill-stats: false
  # Maximum tracked cell-fill classes in debug statistics.
  # Mirrors old VM arg: -Dga.dfc.cellFillStats.maxTrackedClasses=256
  cell-fill-stats-max-tracked-classes: 256
  # Allows compilation of marker inners in the compiling visitor.
  # Mirrors old VM arg: -Ddfc.compileMarkerInners=true
  compile-marker-inners: false
  # Calls the generated JavaToGpu launcher directly instead of the generic launcher invoker.
  # This is a runtime-overhead experiment; disable if direct generated launcher lookup fails.
  # Mirrors old VM arg: -Dga.dfc.gpu.directGeneratedLauncher=true
  gpu-direct-generated-launcher: true
  # Maximum real worldgen GPU payload batches per lifecycle.
  # Use 0 to keep runtime GPU batches disabled while allowing GPU Probe diagnostics; -1 means unlimited.
  # Mirrors old VM arg: -Dga.dfc.gpu.runtimeBatchMax=0
  gpu-runtime-batch-max: 1024
  # Runtime batch checks skipped after microbatch backoff triggers.
  # After this window, GPU is sampled again to detect if batching became useful.
  # Mirrors old VM arg: -Dga.dfc.gpu.runtimeMicroBatchBackoffBatches=256
  gpu-runtime-micro-batch-backoff-batches: 256
  # Consecutive busy GPU runtime attempts before runtime GPU enters temporary backoff.
  # This avoids paying repeated queue/lock overhead when another worker owns the serialized runtime.
  # Mirrors old VM arg: -Dga.dfc.gpu.runtimeMicroBatchBackoffBusyStreak=32
  gpu-runtime-micro-batch-backoff-busy-streak: 32
  # Consecutive single-request microbatch candidates before runtime GPU enters temporary backoff.
  # This avoids repeatedly taking the runtime lock when the current workload is not batching.
  # Mirrors old VM arg: -Dga.dfc.gpu.runtimeMicroBatchBackoffSingleStreak=32
  gpu-runtime-micro-batch-backoff-single-streak: 32
  # Maximum nanoseconds the GPU lock owner spins to collect compatible runtime microbatch requests.
  # Keep this small; 100000ns is 0.1ms.
  # Mirrors old VM arg: -Dga.dfc.gpu.runtimeMicroBatchCollectNanos=100000
  gpu-runtime-micro-batch-collect-nanos: 100000
  # Maximum same-shape DFC cell requests packed into one prepared JavaToGpu runtime launch.
  # Use 1 to disable runtime microbatch packing while keeping opportunistic lock behavior.
  # Mirrors old VM arg: -Dga.dfc.gpu.runtimeMicroBatchMax=8
  gpu-runtime-micro-batch-max: 8
  # Minimum collected runtime microbatch size required before launching GPU.
  # Smaller groups fall back to CPU to avoid expensive 128-point single GPU launches.
  # Mirrors old VM arg: -Dga.dfc.gpu.runtimeMicroBatchMin=2
  gpu-runtime-micro-batch-min: 2
  # Maximum nanoseconds a busy caller waits for a microbatch leader to accept it before CPU fallback.
  # Default 0 keeps busy callers purely opportunistic; accepted callers still wait for GPU completion.
  # Mirrors old VM arg: -Dga.dfc.gpu.runtimeMicroBatchWaitNanos=0
  gpu-runtime-micro-batch-wait-nanos: 0
  # Minimum point count for real worldgen GPU runtime batches.
  # Current 128-point NoiseChunk cell batches are too small; keep 1024 until larger batch aggregation exists.
  # Mirrors old VM arg: -Dga.dfc.gpu.runtimeMinPoints=1024
  gpu-runtime-min-points: 1024
  # Makes real worldgen GPU batches opportunistic: if another chunk worker is using the GPU runtime,
  # the caller falls back to CPU instead of waiting on the serialized runtime lock.
  # Mirrors old VM arg: -Dga.dfc.gpu.opportunisticRuntimeLock=true
  gpu-runtime-opportunistic-lock: true
  # Maximum runtime GPU payload batches checked against CPU during real worldgen.
  # Use 0 to disable runtime GPU parity after preflight; this should stay small for performance runs.
  # Mirrors old VM arg: -Dga.dfc.gpu.runtimeParityBatches=8
  gpu-runtime-parity-batches: 8
  # Minimum node count for cell-lattice hoist candidates.
  # Mirrors old VM arg: -Ddfc.codegen.latticeMinHoistSize=5
  lattice-min-hoist-size: 5
  # Allows per-NoiseChunk CacheAllInCell filler lazy compilation.
  # This is experimental and can create many chunk-specific compiled classes.
  # Keep false for normal world loading.
  # Mirrors old VM arg: -Dga.dfc.lazyCellCacheCompile=true
  lazy-cell-cache-compile: false
  # Maximum per-lifecycle lazy CacheAllInCell filler compiles when lazyCellCacheCompile is enabled.
  # Mirrors old VM arg: -Dga.dfc.lazyCellCacheCompile.max=128
  lazy-cell-cache-compile-max: 128
  # Logs additional spline-search debug information.
  # Mirrors old VM arg: -Ddfc.codegen.logSplineSearch=true
  log-spline-search: false
  # Enables NoiseChunk fillSlice/selectCellYZ timing statistics.
  # Keep false for normal world loading; this is diagnostic-only.
  # Mirrors old VM arg: -Dga.noiseChunk.timingStats=true
  noise-chunk-timing-stats: false
  # Maximum RandomState instances that may eagerly compile their NoiseRouter per server lifecycle.
  # Use 0 to disable eager DFC router compilation, or -1 to restore the old unlimited behaviour.
  # This prevents world-load stalls when a modpack constructs many RandomState instances.
  # Mirrors old VM arg: -Dga.dfc.randomStateCompile.max=0
  random-state-compile-max: 0
  # Comma-separated NoiseRouter root names compiled for admitted RandomStates.
  # Use all for the old full-router behavior, or e.g. finalDensity for a narrow GPU/runtime probe.
  # Mirrors old VM arg: -Dga.dfc.randomStateCompile.routerRoots=all
  random-state-compile-router-roots: all
  # Allows eager Climate.Sampler compilation for RandomStates admitted by randomStateCompileMax.
  # Disabling this keeps biome sampling vanilla while preserving router compilation.
  # Mirrors old VM arg: -Dga.dfc.randomStateCompile.sampler=true
  random-state-compile-sampler: true
  # Maximum compiled-class registry entries kept alive.
  # Mirrors old VM arg: -Dga.dfc.registry.maxEntries=4096
  registry-max-entries: 4096
  # Maximum spline point count that still uses linear search in auto mode.
  # Default is 3 so 4-point splines use exact binary search.
  # Mirrors old VM arg: -Ddfc.codegen.splineLinearSearchMaxPoints=3
  spline-linear-search-max-points: 3
  # Enables runtime spline statistics collection.
  # Mirrors old VM arg: -Ddfc.codegen.splineRuntimeStats=true
  spline-runtime-stats: false
  # Emits spline runtime hooks into generated bytecode.
  # Mirrors old VM arg: -Ddfc.codegen.splineRuntimeStats.emit=true
  spline-runtime-stats-emit: true
  # Sampling shift for spline runtime stats.
  # Lower values sample more often.
  # Mirrors old VM arg: -Ddfc.codegen.splineRuntimeStats.sampleShift=8
  spline-runtime-stats-sample-shift: 8
  # Spline search mode: auto, linear, or binary.
  # Mirrors old VM arg: -Ddfc.codegen.splineSearchMode=auto
  spline-search-mode: auto
  # Enables LUT-guided spline segment selection.
  # Mirrors old VM arg: -Ddfc.codegen.splineSegmentLut=true
  spline-segment-lut: false
  # Bucket count for spline LUT generation.
  # Mirrors old VM arg: -Ddfc.codegen.splineSegmentLutBuckets=128
  spline-segment-lut-buckets: 128
  # Minimum spline size before LUT mode is considered.
  # Mirrors old VM arg: -Ddfc.codegen.splineSegmentLutMinPoints=9
  spline-segment-lut-min-points: 9
  # Maximum tracked spline runtime classes in debug statistics.
  # Mirrors old VM arg: -Dga.dfc.splineStats.maxTrackedClasses=256
  spline-stats-max-tracked-classes: 256
  # Maximum warmed raw density functions count. Use -1 for unlimited.
  # Mirrors old VM arg: -Ddfc.warmer.maxDensityFunctions=...
  warmer-max-density-functions: -1
  # Maximum warmed noise settings count. Use -1 for unlimited.
  # Default 0 avoids compiling every registered noise_settings entry during server start.
  # Mirrors old VM arg: -Ddfc.warmer.maxSettings=...
  warmer-max-settings: 0
  # Enables warming of wired noise_settings RandomStates during server start.
  # This can be expensive in large modpacks, so it is opt-in only.
  # Mirrors old VM arg: -Ddfc.warmer.noiseSettings=true
  warmer-noise-settings: false
  # Enables warming of raw density_function registry entries.
  # Mirrors old VM arg: -Ddfc.warmer.rawDensityFunctions=true
  warmer-raw-density-functions: false
# Example toggle generated from @MixinOnConfig.
# Enable it to allow ExampleGeneratedToggleMixin to load.
enable-basic-example-mixin-test: false
enable-biome-path: true
# Enables the Density Function Compiler mixin module.
# Also disables conflicting C2ME DFC mixins when their compat classes are present.
enable-density-compiler-patch: true
# Generated mixin toggle for dev.sixik.generator_accelerator.common.basic.mixin.ExampleCompatMixin.
enable-example-compat-mixin: true
# Enables optimization for "ImprovedNoise, perlinNoise, SimplexNoise"
enable-noise-path: true
# TerraBlender rebuilds a full uniqueness Area for every biome chunk.
# The Area is already locked and deterministic, so sharing the cloned source's existing
# Area avoids large per-chunk array allocation. Restore vanilla TerraBlender behaviour with
# If `false` a pack depends on per-chunk caches.
terra-blender-recreate-uniqueness-per-chunk: true
# Do not change, used internally.
version: 12
