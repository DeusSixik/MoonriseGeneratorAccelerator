import org.gradle.api.GradleException

def gaMixinJavaDir = file("src/main/java")
def gaMixinResourcesDir = file("src/main/resources")
def gaGeneratedMixinJavaDir = layout.buildDirectory.dir("generated/sources/gaMixin/main/java").get().asFile
def gaConfigFile = file("src/main/java/dev/sixik/generator_accelerator/api/config/GAConfig.java")
def gaGeneratedConfigStart = "// @generatedMixinConfigFields:start"
def gaGeneratedConfigEnd = "// @generatedMixinConfigFields:end"

def gaReadText = { File file ->
    file.getText("UTF-8")
}

def gaWriteTextIfChanged = { File file, String text ->
    if (!file.exists() || gaReadText(file) != text) {
        file.parentFile.mkdirs()
        file.setText(text, "UTF-8")
    }
}

def gaDetectEol = { String text ->
    text.contains("\r\n") ? "\r\n" : "\n"
}

def gaReadAnnotationArguments = { String text, String annotationName ->
    def matcher = (text =~ /(?m)^\s*@${java.util.regex.Pattern.quote(annotationName)}\b/)
    if (!matcher.find()) {
        return null
    }
    def start = matcher.start()

    def marker = "@${annotationName}"

    def cursor = start + marker.length()
    while (cursor < text.length() && Character.isWhitespace(text.charAt(cursor))) {
        cursor++
    }

    if (cursor >= text.length() || text.charAt(cursor) != '(') {
        return ""
    }

    def depth = 1
    def inString = false
    def escaped = false
    def bodyStart = cursor + 1

    for (cursor = bodyStart; cursor < text.length(); cursor++) {
        def ch = text.charAt(cursor)
        if (inString) {
            if (escaped) {
                escaped = false
            } else if (ch == '\\') {
                escaped = true
            } else if (ch == '"') {
                inString = false
            }
            continue
        }

        if (ch == '"') {
            inString = true
        } else if (ch == '(') {
            depth++
        } else if (ch == ')') {
            depth--
            if (depth == 0) {
                return text.substring(bodyStart, cursor)
            }
        }
    }

    throw new GradleException("Unclosed @${annotationName} annotation")
}

def gaDecodeJavaString = { String value ->
    def builder = new StringBuilder()
    for (int index = 0; index < value.length(); index++) {
        def ch = value.charAt(index)
        if (ch != '\\' || index + 1 >= value.length()) {
            builder.append(ch)
            continue
        }

        def next = value.charAt(++index)
        switch (next) {
            case 'n':
                builder.append('\n')
                break
            case 'r':
                builder.append('\r')
                break
            case 't':
                builder.append('\t')
                break
            case 'b':
                builder.append('\b')
                break
            case 'f':
                builder.append('\f')
                break
            case '"':
                builder.append('"')
                break
            case '\\':
                builder.append('\\')
                break
            case 'u':
                if (index + 4 >= value.length()) {
                    throw new GradleException("Invalid unicode escape in annotation string: ${value}")
                }
                def hex = value.substring(index + 1, index + 5)
                builder.append((char) Integer.parseInt(hex, 16))
                index += 4
                break
            default:
                builder.append(next)
        }
    }
    builder.toString()
}

def gaReadNamedStringArgument = { String arguments, String name ->
    if (arguments == null) {
        return null
    }
    def textBlockMatcher = (arguments =~ /(?s)\b${java.util.regex.Pattern.quote(name)}\s*=\s*"""(.*?)"""/)
    if (textBlockMatcher.find()) {
        return textBlockMatcher.group(1).stripIndent().trim()
    }
    def matcher = (arguments =~ /(?s)\b${java.util.regex.Pattern.quote(name)}\s*=\s*"((?:\\.|[^"\\])*)"/)
    matcher.find() ? gaDecodeJavaString(matcher.group(1)) : null
}

def gaReadNamedBooleanArgument = { String arguments, String name, boolean defaultValue ->
    if (arguments == null) {
        return defaultValue
    }
    def matcher = (arguments =~ /\b${java.util.regex.Pattern.quote(name)}\s*=\s*(true|false)\b/)
    matcher.find() ? Boolean.parseBoolean(matcher.group(1)) : defaultValue
}

def gaReadNamedEnumArgument = { String arguments, String name, String defaultValue ->
    if (arguments == null) {
        return defaultValue
    }
    def matcher = (arguments =~ /\b${java.util.regex.Pattern.quote(name)}\s*=\s*(?:[A-Za-z_$][A-Za-z0-9_$.]*\.)?([A-Za-z_$][A-Za-z0-9_$]*)\b/)
    matcher.find() ? matcher.group(1) : defaultValue
}

def gaReadSingleStringArgument = { String arguments ->
    if (arguments == null) {
        return null
    }
    def matcher = (arguments =~ /(?s)^\s*"((?:\\.|[^"\\])*)"\s*$/)
    matcher.find() ? gaDecodeJavaString(matcher.group(1)) : null
}

def gaReadAllSingleStringAnnotations = { String text, String annotationName ->
    def matcher = (text =~ /(?s)@${java.util.regex.Pattern.quote(annotationName)}\s*\(\s*(?:value\s*=\s*)?"((?:\\.|[^"\\])*)"\s*\)/)
    def values = []
    while (matcher.find()) {
        values << gaDecodeJavaString(matcher.group(1))
    }
    values
}

def gaReadAllSingleClassAnnotations = { Map metadata, String text, String annotationName ->
    def matcher = (text =~ /@${java.util.regex.Pattern.quote(annotationName)}\s*\(\s*(?:valueByClass\s*=\s*)?([A-Za-z_$][A-Za-z0-9_$.]*)\s*\.class\s*\)/)
    def values = []
    while (matcher.find()) {
        def rawName = matcher.group(1)
        if (rawName.contains(".")) {
            values << rawName
        } else {
            def imported = metadata.importMap.get(rawName)
            values << (imported != null ? imported : metadata.packageName + "." + rawName)
        }
    }
    values
}

def gaReadNamedStringArrayArgument = { String arguments, String name ->
    if (arguments == null) {
        return []
    }

    def blockMatcher = (arguments =~ /(?s)\b${java.util.regex.Pattern.quote(name)}\s*=\s*\{(.*?)\}/)
    if (blockMatcher.find()) {
        def block = blockMatcher.group(1)
        def values = []
        def stringMatcher = (block =~ /"((?:\\.|[^"\\])*)"/)
        while (stringMatcher.find()) {
            values << gaDecodeJavaString(stringMatcher.group(1))
        }
        return values
    }

    def singleMatcher = (arguments =~ /(?s)\b${java.util.regex.Pattern.quote(name)}\s*=\s*"((?:\\.|[^"\\])*)"/)
    if (singleMatcher.find()) {
        return [gaDecodeJavaString(singleMatcher.group(1))]
    }

    []
}

def gaReadPositionalStringArrayArgument = { String arguments ->
    if (arguments == null) {
        return []
    }

    def trimmed = arguments.trim()
    if (trimmed.startsWith("{") && trimmed.endsWith("}")) {
        def block = trimmed.substring(1, trimmed.length() - 1)
        def values = []
        def stringMatcher = (block =~ /"((?:\\.|[^"\\])*)"/)
        while (stringMatcher.find()) {
            values << gaDecodeJavaString(stringMatcher.group(1))
        }
        return values
    }

    def single = gaReadSingleStringArgument(arguments)
    single == null ? [] : [single]
}

def gaReadPositionalClassArrayArgument = { Map metadata, String arguments ->
    if (arguments == null) {
        return []
    }

    def trimmed = arguments.trim()
    def values = []
    if (trimmed.startsWith("{") && trimmed.endsWith("}")) {
        def block = trimmed.substring(1, trimmed.length() - 1)
        def classMatcher = (block =~ /([A-Za-z_$][A-Za-z0-9_$.]*)\s*\.class/)
        while (classMatcher.find()) {
            values << gaResolveClassReference.call(metadata, classMatcher.group(1))
        }
        return values
    }

    def classMatcher = (trimmed =~ /^([A-Za-z_$][A-Za-z0-9_$.]*)\s*\.class$/)
    if (classMatcher.find()) {
        values << gaResolveClassReference.call(metadata, classMatcher.group(1))
    }
    values
}

def gaResolveClassReference = { Map metadata, String rawName ->
    if (rawName == null || rawName.isBlank()) {
        return rawName
    }
    if (rawName.contains(".")) {
        return rawName
    }

    def imported = metadata.importMap.get(rawName)
    if (imported != null) {
        return imported
    }

    return metadata.packageName + "." + rawName
}

def gaReadNamedClassNameArrayArgument = { Map metadata, String arguments, String name ->
    if (arguments == null) {
        return []
    }

    def parseBlock = { String block ->
        def values = []
        def classMatcher = (block =~ /([A-Za-z_$][A-Za-z0-9_$.]*)\s*\.class/)
        while (classMatcher.find()) {
            values << gaResolveClassReference.call(metadata, classMatcher.group(1))
        }
        values
    }

    def blockMatcher = (arguments =~ /(?s)\b${java.util.regex.Pattern.quote(name)}\s*=\s*\{(.*?)\}/)
    if (blockMatcher.find()) {
        return parseBlock(blockMatcher.group(1))
    }

    def singleMatcher = (arguments =~ /\b${java.util.regex.Pattern.quote(name)}\s*=\s*([A-Za-z_$][A-Za-z0-9_$.]*)\s*\.class/)
    if (singleMatcher.find()) {
        return [gaResolveClassReference.call(metadata, singleMatcher.group(1))]
    }

    []
}

def gaExtractJavaMetadata = { File file ->
    def text = gaReadText(file)
    def packageMatcher = (text =~ /(?m)^\s*package\s+([A-Za-z0-9_.]+)\s*;/)
    def typeMatcher = (text =~ /\b(?:class|record|interface|enum)\s+([A-Za-z0-9_]+)/)
    if (!packageMatcher.find() || !typeMatcher.find()) {
        return null
    }

    def packageName = packageMatcher.group(1)
    def className = typeMatcher.group(1)
    def importMatcher = (text =~ /(?m)^\s*import\s+([A-Za-z0-9_.]+)\s*;/)
    def importMap = [:]
    while (importMatcher.find()) {
        def importedClass = importMatcher.group(1)
        def simpleName = importedClass.substring(importedClass.lastIndexOf('.') + 1)
        importMap.put(simpleName, importedClass)
    }
    [
            file       : file,
            text       : text,
            packageName: packageName,
            className  : className,
            fullName   : packageName + "." + className,
            importMap  : importMap
    ]
}

def gaFindTokenFromMixinPackage = { String packageName ->
    def segments = packageName.split(/\./) as List<String>
    def mixinIndex = segments.indexOf("mixin")
    if (mixinIndex > 0) {
        return segments.get(mixinIndex - 1)
    }
    def commonIndex = segments.indexOf("common")
    if (commonIndex >= 0 && commonIndex + 1 < segments.size()) {
        return segments.get(commonIndex + 1)
    }
    throw new GradleException("Unable to resolve module token from mixin package '${packageName}'")
}

def gaFindTokenFromPluginPackage = { String packageName ->
    def segments = packageName.split(/\./) as List<String>
    def commonIndex = segments.indexOf("common")
    if (commonIndex >= 0 && commonIndex + 1 < segments.size()) {
        return segments.get(commonIndex + 1)
    }
    if (!segments.isEmpty()) {
        return segments.get(segments.size() - 1)
    }
    throw new GradleException("Unable to resolve module token from plugin package '${packageName}'")
}

def gaValidateJavaIdentifier = { String value, String label ->
    if (!(value ==~ /[A-Za-z_$][A-Za-z0-9_$]*/)) {
        throw new GradleException("${label} '${value}' is not a valid Java identifier")
    }
}

def gaFormatCommentBlock = { String comment, String eol ->
    comment.readLines().collect { "                    ${it}" }.join(eol)
}

def gaRenderConfigField = { Map entry, String eol ->
    def comment = entry.comment?.trim() ? entry.comment.trim() : "Generated mixin toggle for ${entry.mixinClass}."
    return [
            "    @Serializable(",
            "            comment = \"\"\"",
            gaFormatCommentBlock(comment, eol),
            "                    \"\"\"",
            "    )",
            "    public boolean ${entry.name} = ${entry.defaultValue};"
    ].join(eol)
}

def gaReadExistingConfigFields = { String configText ->
    def matcher = (configText =~ /(?m)^\s*(?:public|protected|private)\s+[^\n;=]+\s+([A-Za-z_$][A-Za-z0-9_$]*)\s*(?:=|;)/)
    def fields = new LinkedHashSet<String>()
    while (matcher.find()) {
        fields.add(matcher.group(1))
    }
    fields
}

def gaRewriteGeneratedConfigSection = { List<Map> configEntries ->
    if (!gaConfigFile.isFile()) {
        throw new GradleException("GAConfig.java was not found at ${gaConfigFile}")
    }

    def configText = gaReadText(gaConfigFile)
    def eol = gaDetectEol(configText)
    def generatedSectionPattern = ~/(?ms)^[ \t]*\/\/ @generatedMixinConfigFields:start.*?^[ \t]*\/\/ @generatedMixinConfigFields:end/
    if (!(configText =~ generatedSectionPattern).find()) {
        throw new GradleException("GAConfig.java is missing generated field markers")
    }

    def withoutGeneratedSection = configText.replaceFirst(generatedSectionPattern, "")
    def existingFields = gaReadExistingConfigFields(withoutGeneratedSection)
    def generatedEntries = configEntries.findAll { !existingFields.contains(it.name) }
            .unique { it.name }
            .sort { left, right -> left.name <=> right.name }

    def renderedFields = generatedEntries.collect { gaRenderConfigField(it, eol) }
    def renderedSectionLines = ["    ${gaGeneratedConfigStart}"]
    if (!renderedFields.isEmpty()) {
        renderedSectionLines << ""
        renderedSectionLines << renderedFields.join(eol + eol)
        renderedSectionLines << ""
    }
    renderedSectionLines << "    ${gaGeneratedConfigEnd}"
    def renderedSection = renderedSectionLines.join(eol)

    def updatedText = configText.replaceFirst(generatedSectionPattern, java.util.regex.Matcher.quoteReplacement(renderedSection))
    gaWriteTextIfChanged(gaConfigFile, updatedText)
}

def gaApplyPluginFieldToMixinJson = { Map source, String pluginClass ->
    def updated = new LinkedHashMap()
    def inserted = false
    source.each { key, value ->
        if (key == "plugin") {
            return
        }
        updated.put(key, value)
        if (!inserted && (key == "minVersion" || (!source.containsKey("minVersion") && key == "compatibilityLevel") || (!source.containsKey("compatibilityLevel") && key == "package"))) {
            updated.put("plugin", pluginClass)
            inserted = true
        }
    }
    if (!inserted) {
        updated.put("plugin", pluginClass)
    }
    updated
}

def gaRenderMixinBootstrap = { Map<String, List<Map>> mixinsByPlugin, Map<String, List<Map>> compatByPlugin, String eol ->
    def lines = [
            "package dev.sixik.generator_accelerator.api.mixin.generated;",
            "",
            "import dev.sixik.generator_accelerator.api.mixin.GAMixinApplier;",
            "import dev.sixik.generator_accelerator.api.mixin.GAMixinPlugin;",
            "",
            "public final class GeneratedGAMixinBootstrap {",
            "",
            "    private GeneratedGAMixinBootstrap() { }",
            "",
            "    public static void register(GAMixinPlugin plugin) {",
            "        switch (plugin.getClass().getName()) {"
    ]

    def pluginClasses = ((mixinsByPlugin.keySet() + compatByPlugin.keySet()) as Set).collect { it.toString() }.sort()
    if (pluginClasses.isEmpty()) {
        lines << "            default -> { }"
    } else {
        pluginClasses.each { String pluginClass ->
            lines << "            case \"${pluginClass}\" -> {"
            mixinsByPlugin.find { entry -> entry.key.toString() == pluginClass }?.value
                    .sort { left, right -> left.mixinClass <=> right.mixinClass }
                    .each { Map entry ->
                        lines << "                plugin.addMixinToConfig(\"${entry.mixinClass}\", (config) -> config.${entry.name});"
                    }
            compatByPlugin.find { entry -> entry.key.toString() == pluginClass }?.value
                    .sort { left, right -> left.mixinClass <=> right.mixinClass }
                    .each { Map entry ->
                        def requiredClasses = (entry.requiredClasses + entry.requiredClassNames).findAll { it != null && !it.toString().isBlank() }.unique()
                        def disableArgs = entry.disableMixins.isEmpty()
                                ? "new String[0]"
                                : entry.disableMixins.collect { '"' + it + '"' }.join(', ')
                        if (!requiredClasses.isEmpty()) {
                            def createMethod = entry.matchMode == "ANY" ? "createAny" : "createAll"
                            lines << "                plugin.${createMethod}(new String[] { ${requiredClasses.collect { '"' + it + '"' }.join(', ')} },"
                            lines << "                        new GAMixinApplier.Param(\"${entry.mixinClass}\", ${disableArgs})"
                            lines << "                );"
                        } else {
                            lines << "                plugin.create(\"\", new GAMixinApplier.Param(\"${entry.mixinClass}\", ${disableArgs}));"
                        }
                    }
            lines << "            }"
        }
        lines << "            default -> { }"
    }

    lines.addAll([
            "        }",
            "    }",
            "}"
    ])
    lines.join(eol) + eol
}

def gaRenderMixinCanceller = { List<Map> compatEntries, String eol ->
    def pluginClasses = compatEntries.collect { it.pluginClass?.toString() }.findAll { it != null && !it.isBlank() }.unique().sort()
    def lines = []

    lines << "package dev.sixik.generator_accelerator.api.mixin.generated;"
    lines << ""
    lines << "import com.bawnorton.mixinsquared.api.MixinCanceller;"
    lines << "import dev.sixik.generator_accelerator.api.config.GAConfig;"
    lines << "import dev.sixik.generator_accelerator.api.config.GAConfigHolder;"
    lines << "import dev.sixik.generator_accelerator.api.mixin.GAMixinApplier;"
    lines << "import dev.sixik.generator_accelerator.api.mixin.GAMixinPlugin;"
    lines << ""
    lines << "import java.util.List;"
    lines << ""
    lines << "public final class GeneratedGAMixinCanceller implements MixinCanceller {"
    lines << "    private static volatile boolean bootstrapped;"
    lines << ""
    lines << "    private static void bootstrapPlugins() {"
    lines << "        if (bootstrapped) {"
    lines << "            return;"
    lines << "        }"
    lines << "        synchronized (GeneratedGAMixinCanceller.class) {"
    lines << "            if (bootstrapped) {"
    lines << "                return;"
    lines << "            }"
    pluginClasses.each { String pluginClass ->
        lines << "            new ${pluginClass}().bootstrapGeneratedMetadata();"
    }
    lines << "            bootstrapped = true;"
    lines << "        }"
    lines << "    }"
    lines << ""
    lines << "    @Override"
    lines << "    public boolean shouldCancel(List<String> targetClassNames, String mixinClassName) {"
    lines << "        bootstrapPlugins();"
    lines << "        final GAConfig config = GAConfigHolder.getConfig();"
    lines << ""
    lines << "        for (GAMixinApplier mixinApplier : GAMixinPlugin.MixinAppliers) {"
    lines << "            final GAMixinApplier.Param compatParam = mixinApplier.findDisableMixin(mixinClassName);"
    lines << "            if (compatParam != null"
    lines << "                    && mixinApplier.isModLoaded()"
    lines << "                    && GAMixinPlugin.isMixinActive(compatParam.mixinClass(), config)) {"
    lines << "                GAMixinPlugin.logDisabledMixin(mixinClassName, \"COMPAT\", \"disabled by compat mixin \" + compatParam.mixinClass());"
    lines << "                return true;"
    lines << "            }"
    lines << "        }"

    lines << ""
    lines << "        return false;"
    lines << "    }"
    lines << "}"
    lines.join(eol) + eol
}

sourceSets {
    main {
        java.srcDir gaGeneratedMixinJavaDir
    }
}

tasks.register("generateGAMixinMetadata") {
    group = "build setup"
    description = "Generates GA mixin bootstrap metadata and syncs mixin config wiring."

    inputs.dir(gaMixinJavaDir)
    inputs.dir(gaMixinResourcesDir)
    outputs.dir(gaGeneratedMixinJavaDir)
    outputs.upToDateWhen { false }

    doLast {
        delete(gaGeneratedMixinJavaDir)

        def javaFiles = fileTree(gaMixinJavaDir).matching {
            include "**/*.java"
        }.files.sort { left, right -> left.path <=> right.path }

        def mixinPlugins = []
        def annotatedMixins = []
        def compatMixins = []

        javaFiles.each { File javaFile ->
            def metadata = gaExtractJavaMetadata(javaFile)
            if (metadata == null) {
                return
            }

            def autoPluginArgs = gaReadAnnotationArguments(metadata.text, "AutoMixinPlugin")
            if (autoPluginArgs != null) {
                if (!metadata.text.contains("extends GAMixinPlugin")) {
                    throw new GradleException("@AutoMixinPlugin is only supported on GAMixinPlugin classes: ${javaFile}")
                }

                def explicitToken = gaReadNamedStringArgument(autoPluginArgs, "value") ?: gaReadSingleStringArgument(autoPluginArgs)
                def token = explicitToken?.trim() ? explicitToken.trim() : gaFindTokenFromPluginPackage(metadata.packageName)
                mixinPlugins << [
                        token      : token,
                        className  : metadata.fullName,
                        packageName: metadata.packageName,
                        file       : javaFile
                ]
            }

            if (metadata.packageName.contains(".mixin")) {
                def mixinConfigArgs = gaReadAnnotationArguments(metadata.text, "MixinOnConfig")
                if (mixinConfigArgs != null) {
                    def fieldName = gaReadNamedStringArgument(mixinConfigArgs, "name")
                    if (fieldName == null || fieldName.isBlank()) {
                        throw new GradleException("@MixinOnConfig(name = ...) requires a non-empty name in ${javaFile}")
                    }

                    gaValidateJavaIdentifier(fieldName, "Config field")
                    def token = gaFindTokenFromMixinPackage(metadata.packageName)
                    annotatedMixins << [
                            token       : token,
                            name        : fieldName,
                            defaultValue: gaReadNamedBooleanArgument(mixinConfigArgs, "defaultValue", true),
                            comment     : gaReadNamedStringArgument(mixinConfigArgs, "comment"),
                            mixinClass  : metadata.fullName,
                            file        : javaFile
                    ]
                }
            }

            if (metadata.packageName.contains(".mixin")) {
                def mixinCompatArgs = gaReadAnnotationArguments(metadata.text, "MixinCompat")
                def compatMixinArgs = gaReadAnnotationArguments(metadata.text, "CompatMixin")
                def requireModClasses = gaReadAllSingleClassAnnotations(metadata, metadata.text, "RequireModClass")
                def requireModClassNames = gaReadAllSingleStringAnnotations(metadata.text, "RequireModClassName")
                def requireModClassesArgs = gaReadAnnotationArguments(metadata.text, "RequireModClasses")
                def requireModClassNamesArgs = gaReadAnnotationArguments(metadata.text, "RequireModClassNames")
                def disableSingleMixins = gaReadAllSingleStringAnnotations(metadata.text, "DisableMixin")
                def disableSingleMixinsByClass = gaReadAllSingleClassAnnotations(metadata, metadata.text, "DisableMixin")
                def disableMixinsArgs = gaReadAnnotationArguments(metadata.text, "DisableMixins")
                def hasCompatShortcut = compatMixinArgs != null || !requireModClasses.isEmpty() || !requireModClassNames.isEmpty() || requireModClassesArgs != null || requireModClassNamesArgs != null || !disableSingleMixins.isEmpty() || !disableSingleMixinsByClass.isEmpty() || disableMixinsArgs != null
                if (mixinCompatArgs != null || hasCompatShortcut) {

                    def requiredClasses = []
                    def requiredClassNames = []
                    def disableMixins = []

                    if (mixinCompatArgs != null) {
                        requiredClasses.addAll(gaReadNamedClassNameArrayArgument(metadata, mixinCompatArgs, "requiredClasses"))
                        requiredClassNames.addAll(gaReadNamedStringArrayArgument(mixinCompatArgs, "requiredClassNames"))
                        disableMixins.addAll(gaReadNamedStringArrayArgument(mixinCompatArgs, "disableMixins"))
                    }

                    if (compatMixinArgs != null) {
                        def compatMod = gaReadNamedClassNameArrayArgument(metadata, compatMixinArgs, "mod")
                        def compatMods = gaReadNamedClassNameArrayArgument(metadata, compatMixinArgs, "mods")
                        def compatModClassName = gaReadNamedStringArgument(compatMixinArgs, "modClassName")
                        def compatModClassNames = gaReadNamedStringArrayArgument(compatMixinArgs, "modClassNames")
                        def compatDisable = gaReadNamedStringArrayArgument(compatMixinArgs, "disable")
                        def compatDisableByClass = gaReadNamedClassNameArrayArgument(metadata, compatMixinArgs, "disableByClass")

                        requiredClasses.addAll(compatMod)
                        requiredClasses.addAll(compatMods)
                        if (compatModClassName != null && !compatModClassName.isBlank()) {
                            requiredClassNames.add(compatModClassName)
                        }
                        requiredClassNames.addAll(compatModClassNames)
                        disableMixins.addAll(compatDisable)
                        disableMixins.addAll(compatDisableByClass)
                    }

                    requiredClasses.addAll(requireModClasses)
                    requiredClassNames.addAll(requireModClassNames)
                    if (requireModClassesArgs != null) {
                        def fromValue = gaReadNamedClassNameArrayArgument(metadata, requireModClassesArgs, "value")
                        requiredClasses.addAll(fromValue.isEmpty() ? gaReadPositionalClassArrayArgument(metadata, requireModClassesArgs) : fromValue)
                    }
                    if (requireModClassNamesArgs != null) {
                        def fromValue = gaReadNamedStringArrayArgument(requireModClassNamesArgs, "value")
                        requiredClassNames.addAll(fromValue.isEmpty() ? gaReadPositionalStringArrayArgument(requireModClassNamesArgs) : fromValue)
                    }
                    disableMixins.addAll(disableSingleMixins)
                    disableMixins.addAll(disableSingleMixinsByClass)
                    if (disableMixinsArgs != null) {
                        def disableMixinsValue = gaReadNamedStringArrayArgument(disableMixinsArgs, "value")
                        def disableMixinsValueByClass = gaReadNamedClassNameArrayArgument(metadata, disableMixinsArgs, "valueByClass")
                        disableMixins.addAll(disableMixinsValue.isEmpty() ? gaReadPositionalStringArrayArgument(disableMixinsArgs) : disableMixinsValue)
                        disableMixins.addAll(disableMixinsValueByClass)
                    }

                    compatMixins << [
                            token             : gaFindTokenFromMixinPackage(metadata.packageName),
                            mixinClass        : metadata.fullName,
                            requiredClasses   : requiredClasses.unique(),
                            requiredClassNames: requiredClassNames.unique(),
                            matchMode         : compatMixinArgs != null ? gaReadNamedEnumArgument(compatMixinArgs, "mode", "ALL") : "ALL",
                            disableMixins     : disableMixins.unique(),
                            file              : javaFile
                    ]
                }
            }
        }

        def pluginsByToken = [:] as LinkedHashMap<String, Map>
        mixinPlugins.each { Map pluginEntry ->
            def previous = pluginsByToken.putIfAbsent(pluginEntry.token, pluginEntry)
            if (previous != null) {
                throw new GradleException("Multiple @AutoMixinPlugin classes resolved to token '${pluginEntry.token}': ${previous.className} and ${pluginEntry.className}")
            }
        }

        def configFieldsByName = [:] as LinkedHashMap<String, Map>
        annotatedMixins.each { Map mixinEntry ->
            def pluginEntry = pluginsByToken.get(mixinEntry.token)
            if (pluginEntry == null) {
                throw new GradleException("No @AutoMixinPlugin class found for mixin token '${mixinEntry.token}' used by ${mixinEntry.mixinClass}")
            }

            def previousField = configFieldsByName.get(mixinEntry.name)
            if (previousField != null) {
                def sameDefinition = previousField.defaultValue == mixinEntry.defaultValue &&
                        (previousField.comment ?: "") == (mixinEntry.comment ?: "")
                if (!sameDefinition) {
                    throw new GradleException("Conflicting @MixinOnConfig definitions for '${mixinEntry.name}' between ${previousField.mixinClass} and ${mixinEntry.mixinClass}")
                }
            } else {
                configFieldsByName.put(mixinEntry.name, mixinEntry)
            }

            mixinEntry.pluginClass = pluginEntry.className
        }

        compatMixins.each { Map compatEntry ->
            def pluginEntry = pluginsByToken.get(compatEntry.token)
            if (pluginEntry == null) {
                throw new GradleException("No @AutoMixinPlugin class found for mixin token '${compatEntry.token}' used by ${compatEntry.mixinClass}")
            }
            compatEntry.pluginClass = pluginEntry.className
        }

        gaRewriteGeneratedConfigSection(configFieldsByName.values() as List<Map>)

        def bootstrapCompatByPlugin = compatMixins.groupBy { it.pluginClass }
        def mixinsByPlugin = annotatedMixins.groupBy { it.pluginClass }
        def bootstrapFile = new File(gaGeneratedMixinJavaDir, "dev/sixik/generator_accelerator/api/mixin/generated/GeneratedGAMixinBootstrap.java")
        gaWriteTextIfChanged(bootstrapFile, gaRenderMixinBootstrap(mixinsByPlugin, bootstrapCompatByPlugin, System.lineSeparator()))

        def cancellerFile = new File(gaGeneratedMixinJavaDir, "dev/sixik/generator_accelerator/api/mixin/generated/GeneratedGAMixinCanceller.java")
        gaWriteTextIfChanged(cancellerFile, gaRenderMixinCanceller(compatMixins, System.lineSeparator()))

        def seenPluginTokens = new LinkedHashSet<String>()
        fileTree(gaMixinResourcesDir).matching {
            include "**/*.mixins.json"
        }.files.sort { left, right -> left.path <=> right.path }.each { File jsonFile ->
            def parsed = new JsonSlurper().parse(jsonFile)
            if (!(parsed instanceof Map) || parsed.package == null) {
                throw new GradleException("Invalid mixin json file: ${jsonFile}")
            }

            def token = gaFindTokenFromMixinPackage(parsed.package.toString())
            def pluginEntry = pluginsByToken.get(token)
            if (pluginEntry == null) {
                return
            }

            def updated = gaApplyPluginFieldToMixinJson(parsed as Map, pluginEntry.className)
            gaWriteTextIfChanged(jsonFile, JsonOutput.prettyPrint(JsonOutput.toJson(updated)) + System.lineSeparator())
            seenPluginTokens.add(token)
        }

        pluginsByToken.each { String token, Map pluginEntry ->
            if (!seenPluginTokens.contains(token)) {
                logger.lifecycle("GA mixin generator: no *.mixins.json file matched token '${token}' for ${pluginEntry.className}")
            }
        }
    }
}

tasks.named("compileJava") {
    dependsOn "generateGAMixinMetadata"
}

tasks.named("processResources") {
    dependsOn "generateGAMixinMetadata"
}

tasks.matching { it.name in ["prepareWorkspace", "genSources", "idea", "eclipse"] }.configureEach {
    dependsOn "generateGAMixinMetadata"
}

tasks.named("clean") {
    delete(gaGeneratedMixinJavaDir)
}
