architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"


    modCompileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.7-beta.2"))
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.4"))
    compileOnly("com.github.JCTools.JCTools:jctools-core:v4.0.3")

    modCompileOnly ("curse.maven:oh-the-biomes-weve-gone-1070751:7759426")
    modCompileOnly ("curse.maven:natures-spirit-1044992:6962783")
    modCompileOnly ("curse.maven:lithostitched-936015:6742615")
    modCompileOnly ("curse.maven:terrablender-563928:6290448")
    modCompileOnly ("curse.maven:oreberries-replanted-454062:5138729")
    modCompileOnly ("curse.maven:owo-lib-532610:4749199")
    modCompileOnly ("curse.maven:zeta-968868:7335229")

    modCompileOnly ("curse.maven:artifacts-312353:7903806")
    modCompileOnly ("curse.maven:repurposed-structures-368293:7971681")
    modCompileOnly ("curse.maven:waystones-245755:7682270")
    modCompileOnly ("curse.maven:blueprint-382216:6408581")
    modCompileOnly ("curse.maven:countereds-terrain-slabs-1125437:7962044")
    modCompileOnly ("curse.maven:gregtechceu-modern-890405:7917773")

    modCompileOnly ("curse.maven:yungs-extras-480006:4769514")
    modCompileOnly ("curse.maven:yungs-bridges-536660:4769518")
    modCompileOnly ("curse.maven:dynamictrees-252818:7502488")
}

tasks.withType(JavaCompile).configureEach {
    // Включаем максимальную болтливость компилятора и самого Mixin AP
    options.compilerArgs << "-XprintProcessorInfo"
    options.compilerArgs << "-Amixin.debug.verbose=true"
}