plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    runs {
        client {
            vmArgs  "-Dga.dfc.gpu=true",
                    "-Dga.dfc.lazyCellCacheCompile=false",
                    "-Dga.dfc.gpu.runtimeInfoLog=true"
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def lwjglNatives = osName.contains('win')
        ? 'natives-windows'
        : (osName.contains('mac') ? 'natives-macos' : 'natives-linux')
def javaToGpuLocalCoordinate = "io.github.deussixik:processor:${rootProject.java_to_gpu_version}"
def javaToGpuRuntimeLibraries = [
        javaToGpuLocalCoordinate,
        "io.github.deussixik:packager:1.0.0-alpha.1",
        "com.github.javaparser:javaparser-core:3.28.1",
        "org.lwjgl:lwjgl-opencl:3.3.3",
        "org.lwjgl:lwjgl:3.3.3:${lwjglNatives}"
]

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"


    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:0.3.7-beta.1")))
    include(minecraftRuntimeLibraries("com.github.ben-manes.caffeine:caffeine:3.1.8"))
    include(minecraftRuntimeLibraries("com.github.JCTools.JCTools:jctools-core:v4.0.3"))
    include(minecraftRuntimeLibraries("com.github.DeusSixik:JavaNativeCollections:$rootProject.java_native_collections_version"))
    include(minecraftRuntimeLibraries("org.yaml:snakeyaml:2.2"))
    include(minecraftRuntimeLibraries("ca.spottedleaf:yamlconfig:1.0.2"))

    javaToGpuRuntimeLibraries.each { coordinate ->
        include(minecraftRuntimeLibraries(coordinate))
    }
    annotationProcessor javaToGpuLocalCoordinate
    annotationProcessor "io.github.deussixik:javatogpu-ir-validation:${rootProject.java_to_gpu_version}"

    modCompileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.7-beta.1"))
    modCompileOnly "maven.modrinth:modernfix:$rootProject.modernfix_version"
    compileOnlyApi "curse.maven:confluence-1209464:7677430"

    modRuntimeOnly "curse.maven:spark-361579:6225208"

    if (project.hasProperty('withMoonrise')) {
        modRuntimeOnly "curse.maven:moonrise-1096335:7089177"
    }

    if(project.hasProperty('withC2ME')) {
        modRuntimeOnly "curse.maven:c2me-533097:7694225"
    }

    if(project.hasProperty('withModernFix')) {
        modRuntimeOnly "maven.modrinth:modernfix:$rootProject.modernfix_version"
    }

    modCompileOnly "curse.maven:zeta-968868:7980010"

    modCompileOnly "curse.maven:alexs-caves-unofficial-port-1420348:7981977"
    modCompileOnly "curse.maven:citadel-1-21-1-port-1415723:7982052"

    modRuntimeOnly "foundry.imguimc:imguimc-neoforge-${minecraft_version}:$imguimc_version"

    minecraftRuntimeLibraries("io.github.spair:imgui-java-binding:$imguiVersion")
    minecraftRuntimeLibraries("io.github.spair:imgui-java-lwjgl3:$imguiVersion")
    minecraftRuntimeLibraries("io.github.spair:imgui-java-natives-windows:$imguiVersion")
}

processResources {
    inputs.property 'version', project.version
    def commonProject = project(':common')
    def commonMixinConfigListFile = commonProject.ext.gaGeneratedCommonMixinConfigListFile
    dependsOn commonProject.tasks.named('generateGAMixinMetadata')
    inputs.file commonMixinConfigListFile

    filesMatching('META-INF/neoforge.mods.toml') {
        def mixinConfigs = commonMixinConfigListFile.readLines('UTF-8').findAll { !it.isBlank() }
        def mixinBlocks = mixinConfigs.collect { String configName -> "[[mixins]]\nconfig = \"${configName}\"" }.join('\n\n')
        expand(
                version: project.version,
                gaMixinBlocks: mixinBlocks
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

tasks.matching { it.name.startsWith("run") || it.name.startsWith("prepareRun") }.configureEach {
    dependsOn project(":common").tasks.named("processResources")
}

tasks.withType(JavaExec).configureEach {
    if (rootProject.hasProperty("gaJvmArgs")) {
        jvmArgs rootProject.property("gaJvmArgs").toString().split("\\s+").findAll { !it.isBlank() }
    }
}
